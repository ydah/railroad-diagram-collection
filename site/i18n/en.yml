parser_grammar: These diagrams describe a parser grammar, rather than the complete language specification. Lexer state and semantic checks may impose additional restrictions.
parse_y_vs_prism: Ruby uses Prism by default since 3.4. These diagrams describe parse.y (--parser=parse.y); accepted syntax can differ from Prism.
grammar_snapshot: This is an upstream ANTLR grammar snapshot. Its date identifies the grammar revision, rather than a language release.
