name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  request-checks:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo '${{ github.repository }}' --ref main
  build:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.current.outputs.eligible }}
    steps:
      - id: current
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED: ${{ github.event.workflow_run.head_sha }}
        run: |
          current=$(gh api 'repos/${{ github.repository }}/git/ref/heads/main' --jq .object.sha)
          if [ "$current" = "$EXPECTED" ]; then echo 'eligible=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v8
        if: steps.current.outputs.eligible == 'true'
        with:
          name: dist
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/configure-pages@v6
        if: steps.current.outputs.eligible == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.current.outputs.eligible == 'true'
        with: {path: dist}
  deploy:
    needs: build
    if: needs.build.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: current
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED: ${{ github.event.workflow_run.head_sha }}
        run: |
          current=$(gh api 'repos/${{ github.repository }}/git/ref/heads/main' --jq .object.sha)
          if [ "$current" = "$EXPECTED" ]; then echo 'eligible=true' >> "$GITHUB_OUTPUT"; fi
      - id: deployment
        if: steps.current.outputs.eligible == 'true'
        uses: actions/deploy-pages@v5
