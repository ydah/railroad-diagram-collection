name: Grammar or display problem
description: Report an incorrect production or a browsing problem.
body:
  - type: input
    id: url
    attributes: {label: Rule URL, description: Include the language and version.}
    validations: {required: true}
  - type: textarea
    id: problem
    attributes: {label: Expected and actual behavior, description: Add a small example and upstream production if relevant.}
    validations: {required: true}
  - type: input
    id: browser
    attributes: {label: Browser and device, description: For display or interaction problems.}
