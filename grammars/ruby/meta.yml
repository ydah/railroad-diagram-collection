---
display_name: Ruby
description:
  en: Ruby parser grammar, based on parse.y rather than Prism.
  ja: Ruby の parse.y に基づく文法です。Prism の文法とは異なります。
epsilon_rules:
- none
hide_rules: []
token_display:
  tIDENTIFIER:
    display: identifier
    kind: class
  tFID:
    display: method name
    kind: class
  tGVAR:
    display: global variable
    kind: class
  tIVAR:
    display: instance variable
    kind: class
  tCONSTANT:
    display: constant
    kind: class
  tCVAR:
    display: class variable
    kind: class
  tLABEL:
    display: label
    kind: class
  tINTEGER:
    display: integer
    kind: class
  tFLOAT:
    display: float
    kind: class
  tRATIONAL:
    display: rational
    kind: class
  tIMAGINARY:
    display: imaginary number
    kind: class
  tCHAR:
    display: character
    kind: class
  tSTRING_CONTENT:
    display: string content
    kind: class
  tNTH_REF:
    display: numbered reference
    kind: class
  tBACK_REF:
    display: back reference
    kind: class
  "'\\n'":
    display: newline
    kind: class
  keyword_do_cond:
    display: do
    kind: keyword
  keyword_do_block:
    display: do
    kind: keyword
  keyword_do_LAMBDA:
    display: do
    kind: keyword
categories:
  statements:
  - stmt
  - stmts
  - top_stmt
  - top_stmts
  expressions:
  - expr
  - arg
  - primary
simplify:
  factor_prefix: true
  inline_trivial: false
